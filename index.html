<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Manager v4.0.0</title>
    <!-- Version 4.0.0 - December 2025 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Fira Code', monospace;
        }

        .font-mono, .font-mono *:not(.fas):not(.far):not(.fab):not(.fa) {
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
        }
        
        .gradient-bg {
            background: #3a4a5c;
        }
        
        .gradient-bg-light {
            background: #f7fafc;
        }
        
        .card-shadow {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .card-shadow-dark {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        
        .transition-all {
            transition: all 0.3s ease;
        }
        
        .hover-scale:hover {
            transform: scale(1.02);
        }
        
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Table horizontal scroll - always show scrollbar */
        .table-scroll-container {
            scrollbar-width: thin;
            scrollbar-color: #4b5563 transparent;
        }
        .table-scroll-container::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .table-scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .table-scroll-container::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb:hover {
            background-color: #6b7280;
        }

        /* Column resize handle */
        .col-resize-handle {
            cursor: col-resize;
            user-select: none;
        }
        .col-resize-handle:hover, .col-resize-handle:active {
            background-color: rgba(59, 130, 246, 0.5);
        }
        
        .select-custom {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        /* Help icon tooltip styles */
        .help-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .help-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 400;
            z-index: 1000;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            margin-bottom: 8px;
            width: 220px;
            white-space: normal;
            text-align: center;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .help-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
        }

        .help-icon:hover .help-tooltip {
            visibility: visible;
            opacity: 1;
        }

        .help-tooltip-dark {
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
        }

        .help-tooltip-dark::after {
            border-color: #1f2937 transparent transparent transparent;
        }

        .help-tooltip-light {
            background: #ffffff;
            color: #374151;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .help-tooltip-light::after {
            border-color: #ffffff transparent transparent transparent;
        }
    </style>
</head>
<body class="m-0 p-0">
    <div id="root"></div>
    <script src="/static/app.js"></script>
</body>
</html>
